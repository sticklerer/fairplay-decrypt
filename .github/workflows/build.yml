
name: Applebaum Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on macOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Apple SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build dependencies
        run: |
          brew install ldid
          make --version

      - name: Build
        run: make -C credential-retrieval

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: applebaum-build
          path: credential-retrival/build/
          if-no-files-found: error
          retention-days: 14
